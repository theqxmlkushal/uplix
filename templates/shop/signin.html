{% extends "shop/base.html" %}
{% block title %}Sign in - Uplix Live{% endblock %}
{% block body %}
<section class="auth">
  <h1>Sign in</h1>

  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}

  <form method="post" action="/signin" class="form">
    <label for="nickname">Nickname</label>
    <input id="nickname" name="nickname" type="text" maxlength="20"
           autocomplete="username" required>

    <label for="pin">4-digit PIN</label>
    <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*"
           maxlength="4" autocomplete="current-password" required>

    <button type="submit" class="primary">Sign in</button>
  </form>

  <p class="muted">New here? <a href="/signup">Create an account</a></p>
  <p class="muted small">Signing in as a customer. <a href="/login">Change role</a></p>
</section>
{% endblock %}
